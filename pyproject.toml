[tool.poetry]
name = "config_compare"
version = "0.1.0"
description = "Compare dataclass vs pydantic configs example"
authors = ["bipinns <you@example.com>"]
packages = [
  { include = "config_compare", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.8"
pydantic = "^1.10"

[tool.poetry.dev-dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
